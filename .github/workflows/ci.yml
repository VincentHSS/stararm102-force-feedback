name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check syntax
        run: python -m py_compile stararm102_ro.py b601_dm.py stararm102_b601_dm.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check command line help
        run: python stararm102_ro.py --help
      - name: Check B601 profile
        run: python stararm102_b601_dm.py --check
      - name: Simulate B601 stall feedback
        run: python stararm102_b601_dm.py --simulate --simulate-stall-joint 0
