name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ./integrations/lerobot_auto_feedback
      - name: Check syntax
        run: python -m compileall -q stararm102_ro.py integrations/lerobot_auto_feedback/stararm_auto_feedback integrations/lumos
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Lumos optimized version tests
        working-directory: integrations/lumos
        run: python -m unittest discover -s tests -v
      - name: Check Lumos command line help
        run: python integrations/lumos/stararm102_lumos_teleop.py --help
      - name: Check command line help
        run: python stararm102_ro.py --help
      - name: Check official feedback installer
        run: python -m stararm_auto_feedback.install --help
